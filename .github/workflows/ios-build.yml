# Builds an unsigned .ipa on a GitHub macOS runner (no Mac or paid Apple account needed).
# Download the "ToDo-ipa" artifact from the run, then install it with Sideloadly using a free Apple ID.
name: iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "::notice title=Toolchain::$(xcodebuild -version | head -1), node $(node -v)"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx jest --ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      # Local notifications don't need push; a free Apple ID can't sign the push entitlement.
      - name: Remove push entitlement
        run: |
          for f in ios/*/*.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" 2>/dev/null || true
          done

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build app
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          STATUS=$?
          set -e
          tail -n 150 xcodebuild.log
          if [ $STATUS -ne 0 ]; then
            # Surface the errors as annotations so they show on the run summary page.
            grep -E "error:|fatal error|\*\* BUILD FAILED|requires|unsupported" xcodebuild.log \
              | grep -v "^note:" | sort -u | head -20 \
              | while IFS= read -r line; do echo "::error title=xcodebuild::${line:0:900}"; done
            exit $STATUS
          fi

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist && zip -qr ToDo.ipa Payload
          ls -lh ToDo.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: ToDo-ipa
          path: dist/ToDo.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
